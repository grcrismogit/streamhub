# Entorno LOCAL de desarrollo: PostgreSQL (simula RDS) + moto (simula S3).
# Uso: docker compose up -d   (ver README → "Ejecutar en local")
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamhub
      POSTGRES_USER: streamhub
      POSTGRES_PASSWORD: devpass
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamhub"]
      interval: 5s
      retries: 10

  s3:
    image: motoserver/moto:latest
    ports: ["5000:5000"]

volumes:
  pgdata:
